# cbindgen configuration for include/textforge.h.
# Regenerate with: TEXTFORGE_UPDATE_HEADER=1 cargo test --test header
language = "C"
cpp_compat = true
include_guard = "TEXTFORGE_H"
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from the textforge_c crate. Do not edit by hand. */"
header = """/*
 * TextForge C binding.
 *
 * Copyright (C) the TextForge contributors.
 * SPDX-License-Identifier: GPL-3.0-only
 *
 * Conventions used by every function:
 *  - Text is UTF-8 passed as (pointer, byte length); TF_NTS means "NUL-terminated".
 *  - Fallible functions return TfStatus (TF_STATUS_OK == 0). The optional last
 *    argument `TfError **error` receives details on failure; *error must be NULL
 *    on entry. Release it with tf_error_free.
 *  - Out-parameters are written only on success.
 *  - Objects are released with their tf_*_free function; free functions accept NULL.
 *  - Functions documented as consuming release that argument on every path.
 *  - Builder functions return the pipeline and keep the first failure as a
 *    sticky error reported by tf_pipeline_compile / tf_pipeline_status.
 */"""

after_includes = """

/**
 * Length sentinel meaning "the text is NUL-terminated; measure it".
 *
 * Pass it wherever a function takes a `(const char *text, size_t length)`
 * pair. With an explicit length the text may contain NUL bytes.
 *
 * ```c
 * TfPipeline *plan = tf_pipeline_new();
 * tf_pipeline_add_to_end(plan, tf_text_n("!", TF_NTS));
 * tf_pipeline_free(plan);
 * ```
 */
#define TF_NTS SIZE_MAX"""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["TfStatus", "TfStage", "TfArgKind"]
